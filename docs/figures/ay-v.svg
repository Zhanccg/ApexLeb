<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc3ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4cc3ff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" rx="10" fill="#0d1219"/>
  <rect x="0.5" y="0.5" width="719" height="359" rx="10" fill="none" stroke="#1c2634"/>
  <text x="24" y="30" font-size="14" font-weight="700" fill="#eef3f8">侧向加速度 – 车速对照（真实试跑数据 · R=50 m · μ=1.0）</text>
  <text x="696" y="30" text-anchor="end" font-size="10" letter-spacing="2" fill="#647182" font-family="'JetBrains Mono', monospace">ay = v²/R</text>

  <!-- grid + y ticks -->
  <g stroke="#1c2634" stroke-dasharray="3 5">
    <line x1="70" y1="300" x2="690" y2="300"/>
    <line x1="70" y1="222.9" x2="690" y2="222.9"/>
    <line x1="70" y1="145.7" x2="690" y2="145.7"/>
    <line x1="70" y1="68.6" x2="690" y2="68.6"/>
  </g>
  <g font-size="10" fill="#647182" text-anchor="end" font-family="'JetBrains Mono', monospace">
    <text x="62" y="303">0</text><text x="62" y="226">4</text><text x="62" y="149">8</text><text x="62" y="72">12</text>
  </g>
  <text x="24" y="52" font-size="10" fill="#8b98a9">ay / m/s²</text>
  <text x="690" y="330" text-anchor="end" font-size="10" fill="#8b98a9">v / km/h</text>
  <g font-size="10" fill="#647182" text-anchor="middle" font-family="'JetBrains Mono', monospace">
    <text x="214.7" y="318">54</text><text x="400.7" y="318">72</text><text x="586.7" y="318">90</text>
  </g>

  <!-- reference line μg -->
  <line x1="70" y1="110.8" x2="690" y2="110.8" stroke="#ffb800" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="688" y="104" text-anchor="end" font-size="10" fill="#ffb800" font-family="'JetBrains Mono', monospace">ay_max = μg = 9.81 m/s²</text>

  <path d="M214.7 213.2 L400.7 145.7 L586.7 58.9 L586.7 300 L214.7 300 Z" fill="url(#area)"/>
  <path d="M214.7 213.2 L400.7 145.7 L586.7 58.9" fill="none" stroke="#4cc3ff" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="214.7" cy="213.2" r="4.5" fill="#0d1219" stroke="#4cc3ff" stroke-width="2"/>
  <circle cx="400.7" cy="145.7" r="4.5" fill="#0d1219" stroke="#4cc3ff" stroke-width="2"/>
  <circle cx="586.7" cy="58.9" r="5" fill="#0d1219" stroke="#ffb800" stroke-width="2.2"/>
  <g font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">
    <text x="224" y="206" fill="#5ce8d8">4.50 · λ 45.9%</text>
    <text x="410" y="139" fill="#5ce8d8">8.00 · λ 81.5%</text>
    <text x="576" y="50" text-anchor="end" fill="#ffb800">12.50 · λ 127.4% 超出附着</text>
  </g>
  <text x="24" y="346" font-size="10" fill="#647182">λ &gt; 1 仅表示简化模型内无法维持该半径的匀速圆周运动 · v_limit = √(μgR) ≈ 79.73 km/h</text>
</svg>